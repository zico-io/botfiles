# sops creation rules. Read by the `sops` CLI at encryption time only; nothing
# in the flake parses this file.
#
# REPLACE the placeholder with the host's real age recipient, derived from its
# SSH host key. See README.md in this directory.
creation_rules:
  - path_regex: sandbox-host\.yaml$
    age: age1placeholderreplacewiththesandboxhostagerecipient00000000000
