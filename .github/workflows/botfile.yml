name: botfile
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: selfcheck
        run: ./bin/botfile selfcheck
      - name: toolbox selfcheck
        run: ./bin/toolbox selfcheck
      - name: validate
        run: ./bin/botfile validate
      - name: budget-check
        run: ./bin/botfile budget-check

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: flake check
        run: nix flake check --no-build --show-trace
      - name: botfile gates as nix checks
        run: |
          nix build --show-trace --print-build-logs \
            .#checks.x86_64-linux.botfile-selfcheck \
            .#checks.x86_64-linux.botfile-validate \
            .#checks.x86_64-linux.botfile-budget-check \
            .#checks.x86_64-linux.toolbox-selfcheck
